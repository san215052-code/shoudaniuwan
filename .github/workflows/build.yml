name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version=8.2

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # 【核心新增步骤】在这里自动生成临时签名证书，解决找不到 keystore 的报错
    - name: Generate Temporary Keystore
      run: |
        keytool -genkey -v -keystore release.keystore \
        -alias release -keyalg RSA -keysize 2048 -validity 10000 \
        -passin pass:android -passout pass:android \
        -dname "CN=Android, OU=Dev, O=Android, L=Local, ST=Local, C=US"

    - name: Build with Gradle (Release)
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
