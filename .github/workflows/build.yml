name: Build and Sign Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 动态生成 Gradle 8.5 包装器
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5

      # 4. 赋予 gradlew 执行权限
      - name: Make gradlew executable
        run: |
          chmod +x ./gradlew

      # 5. 创建签名密钥文件
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias key0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=AudioSplitter, OU=Dev, O=AudioSplitter, L=City, ST=State, C=CN"

      # 6. 使用 --scan 或详细参数打包，并打印出具体错误
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --info --no-daemon --stacktrace || (echo "=== BUILD FAILED ===" && exit 1)

      # 7. 上传构件
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
