name: Build and Sign Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 JDK 17（适配现代 Android 项目编译需求）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 动态生成满足 Android 插件最低版本要求的 Gradle 8.5 包装器
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5

      # 4. 赋予 gradlew 执行权限
      - name: Make gradlew executable
        run: |
          chmod +x ./gradlew

      # 5. 自动创建打包所需的签名密钥文件（Release Keystore）
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias key0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=AudioSplitter, OU=Dev, O=AudioSplitter, L=City, ST=State, C=CN"

      # 6. 使用生成的 gradlew 执行 Release 打包（添加 --no-daemon 避免在 CI 环境中产生不必要的后台常驻进程）
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 7. 上传打包好的 Release APK 作为构建产物 (Artifacts)
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
