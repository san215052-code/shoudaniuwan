name: Build and Sign Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 使用 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 动态生成密钥
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias key0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=AudioSplitter, OU=Dev, O=AudioSplitter, L=City, ST=State, C=CN"

      # 直接调用系统自带 Gradle 构建，彻底绕过 Gradle 服务端抽风问题
      - name: Build Signed Release APK
        run: gradle assembleRelease --console=plain

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioSplitter-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
